Screen As screen.scrSiteConditions:
    Fill: =gblTheme.Light
    
    HeaderContainer As groupContainer:
        Fill: =gblTheme.Primary
        Height: =gblDevice.HeaderHeight
        Width: =Parent.Width
        X: =0
        Y: =0
        
        lblHeader As label:
            Text: ="Step 5: Site Conditions Checklist"
            Color: =gblTheme.White
            Size: =gblDevice.FontSize + 4
            FontWeight: =FontWeight.Bold
            X: =gblDevice.Padding
            Y: =(Parent.Height - Self.Height) / 2
            Width: =Parent.Width - (gblDevice.Padding * 2)
            Height: =30
    
    MainContainer As scrollableScreen:
        Fill: =gblTheme.White
        Height: =Parent.Height - HeaderContainer.Height - FooterContainer.Height - (gblDevice.Padding * 2)
        Width: =Parent.Width - (gblDevice.Padding * 2)
        X: =gblDevice.Padding
        Y: =HeaderContainer.Height + gblDevice.Padding
        
        lblInstruction As label:
            Text: ="Check all site conditions. Any items marked as non-compliant will automatically generate findings."
            Color: =gblTheme.Text
            Size: =gblDevice.FontSize
            X: =gblDevice.Padding
            Y: =gblDevice.Padding
            Width: =Parent.Width - (gblDevice.Padding * 2)
            Height: =60
            
        // Dumping Section
        lblDumpingHeader As label:
            Text: ="Dumping & Disposal:"
            Color: =gblTheme.Secondary
            Size: =gblDevice.FontSize + 2
            FontWeight: =FontWeight.Bold
            X: =gblDevice.Padding
            Y: =lblInstruction.Y + lblInstruction.Height + 15
            Width: =Parent.Width - (gblDevice.Padding * 2)
            
        chkNoDumping As checkbox:
            Text: ="No evidence of illegal dumping"
            Default: =true
            OnCheck: |+
                If(!Self.Value,
                    Collect(colFindings, {
                        CorrectiveActionText: "Evidence of illegal dumping observed on site",
                        FindingCategory: "Site Conditions",
                        Severityoffiding: "Major",
                        AppFindingID: GUID(),
                        FixedOnSite: false,
                        AutoGenerated: true
                    })
                );
            X: =gblDevice.Padding
            Y: =lblDumpingHeader.Y + lblDumpingHeader.Height + 5
            Width: =Parent.Width - (gblDevice.Padding * 2)
            
        chkProperWasteStorage As checkbox:
            Text: ="Waste stored properly in designated areas"
            Default: =true
            OnCheck: |+
                If(!Self.Value,
                    Collect(colFindings, {
                        CorrectiveActionText: "Improper waste storage detected",
                        FindingCategory: "Waste Management",
                        Severityoffiding: "Major",
                        AppFindingID: GUID(),
                        FixedOnSite: false,
                        AutoGenerated: true
                    })
                );
            X: =gblDevice.Padding
            Y: =chkNoDumping.Y + chkNoDumping.Height + 5
            Width: =Parent.Width - (gblDevice.Padding * 2)
            
        // Staining Section
        lblStainingHeader As label:
            Text: ="Staining & Spills:"
            Color: =gblTheme.Secondary
            Size: =gblDevice.FontSize + 2
            FontWeight: =FontWeight.Bold
            X: =gblDevice.Padding
            Y: =chkProperWasteStorage.Y + chkProperWasteStorage.Height + 20
            Width: =Parent.Width - (gblDevice.Padding * 2)
            
        chkNoStaining As checkbox:
            Text: ="No soil or pavement staining observed"
            Default: =true
            OnCheck: |+
                If(!Self.Value,
                    Collect(colFindings, {
                        CorrectiveActionText: "Soil or pavement staining observed - potential contamination",
                        FindingCategory: "Environmental",
                        Severityoffiding: "Major",
                        AppFindingID: GUID(),
                        FixedOnSite: false,
                        AutoGenerated: true
                    })
                );
            X: =gblDevice.Padding
            Y: =lblStainingHeader.Y + lblStainingHeader.Height + 5
            Width: =Parent.Width - (gblDevice.Padding * 2)
            
        chkSpillKitsAvailable As checkbox:
            Text: ="Spill kits available and accessible"
            Default: =true
            OnCheck: |+
                If(!Self.Value,
                    Collect(colFindings, {
                        CorrectiveActionText: "Spill kits not available or not accessible",
                        FindingCategory: "Safety",
                        Severityoffiding: "Minor",
                        AppFindingID: GUID(),
                        FixedOnSite: false,
                        AutoGenerated: true
                    })
                );
            X: =gblDevice.Padding
            Y: =chkNoStaining.Y + chkNoStaining.Height + 5
            Width: =Parent.Width - (gblDevice.Padding * 2)
            
        // Secondary Containment
        lblContainmentHeader As label:
            Text: ="Secondary Containment:"
            Color: =gblTheme.Secondary
            Size: =gblDevice.FontSize + 2
            FontWeight: =FontWeight.Bold
            X: =gblDevice.Padding
            Y: =chkSpillKitsAvailable.Y + chkSpillKitsAvailable.Height + 20
            Width: =Parent.Width - (gblDevice.Padding * 2)
            
        chkSecondaryContainment As checkbox:
            Text: ="Secondary containment in place for all tanks"
            Default: =true
            OnCheck: |+
                If(!Self.Value,
                    Collect(colFindings, {
                        CorrectiveActionText: "Secondary containment missing or inadequate for storage tanks",
                        FindingCategory: "SPCC",
                        Severityoffiding: "Major",
                        AppFindingID: GUID(),
                        FixedOnSite: false,
                        AutoGenerated: true
                    })
                );
            X: =gblDevice.Padding
            Y: =lblContainmentHeader.Y + lblContainmentHeader.Height + 5
            Width: =Parent.Width - (gblDevice.Padding * 2)
            
        chkContainmentIntact As checkbox:
            Text: ="Containment structures are intact and functional"
            Default: =true
            OnCheck: |+
                If(!Self.Value,
                    Collect(colFindings, {
                        CorrectiveActionText: "Containment structures damaged or non-functional",
                        FindingCategory: "SPCC",
                        Severityoffiding: "Major",
                        AppFindingID: GUID(),
                        FixedOnSite: false,
                        AutoGenerated: true
                    })
                );
            X: =gblDevice.Padding
            Y: =chkSecondaryContainment.Y + chkSecondaryContainment.Height + 5
            Width: =Parent.Width - (gblDevice.Padding * 2)
            
        // Housekeeping
        lblHousekeepingHeader As label:
            Text: ="General Housekeeping:"
            Color: =gblTheme.Secondary
            Size: =gblDevice.FontSize + 2
            FontWeight: =FontWeight.Bold
            X: =gblDevice.Padding
            Y: =chkContainmentIntact.Y + chkContainmentIntact.Height + 20
            Width: =Parent.Width - (gblDevice.Padding * 2)
            
        chkGoodHousekeeping As checkbox:
            Text: ="Site maintains good housekeeping practices"
            Default: =true
            OnCheck: |+
                If(!Self.Value,
                    Collect(colFindings, {
                        CorrectiveActionText: "Poor housekeeping observed - site organization needed",
                        FindingCategory: "Site Conditions",
                        Severityoffiding: "Minor",
                        AppFindingID: GUID(),
                        FixedOnSite: false,
                        AutoGenerated: true
                    })
                );
            X: =gblDevice.Padding
            Y: =lblHousekeepingHeader.Y + lblHousekeepingHeader.Height + 5
            Width: =Parent.Width - (gblDevice.Padding * 2)
            
        btnGeneralPhotos As button:
            Text: ="📷 Add Site Photos"
            OnSelect: |+
                Navigate(scrPhotoCapture, ScreenTransition.Cover);
            Fill: =gblTheme.Secondary
            Color: =gblTheme.White
            X: =gblDevice.Padding
            Y: =chkGoodHousekeeping.Y + chkGoodHousekeeping.Height + 20
            Width: =180
            Height: =40
    
    FooterContainer As groupContainer:
        Fill: =gblTheme.Light
        Height: =gblDevice.FooterHeight
        Width: =Parent.Width
        X: =0
        Y: =Parent.Height - Self.Height
        
        btnBack As button:
            Text: ="Back"
            OnSelect: |+
                Set(varCurrentStep, 4);
                Navigate(scrInventories, ScreenTransition.ScreenTransition.Fade);
            Fill: =gblTheme.Border
            Color: =gblTheme.Text
            X: =gblDevice.Padding
            Y: =(Parent.Height - Self.Height) / 2
            Width: =100
            Height: =50
            
        btnNext As button:
            Text: ="Review Findings"
            OnSelect: |+
                Set(varCurrentStep, 6);
                Navigate(scrFindingsReview, ScreenTransition.ScreenTransition.Fade);
            Fill: =gblTheme.Primary
            Color: =gblTheme.White
            X: =Parent.Width - Self.Width - gblDevice.Padding
            Y: =(Parent.Height - Self.Height) / 2
            Width: =180
            Height: =50
            FontWeight: =FontWeight.Semibold

