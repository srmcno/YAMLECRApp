Screen As screen.scrComplete:
    Fill: =gblTheme.Light
    
    HeaderContainer As groupContainer:
        Fill: =gblTheme.Success
        Height: =gblDevice.HeaderHeight
        Width: =Parent.Width
        X: =0
        Y: =0
        
        lblHeader As label:
            Text: ="Audit Complete!"
            Color: =gblTheme.White
            Size: =gblDevice.FontSize + 4
            FontWeight: =FontWeight.Bold
            X: =gblDevice.Padding
            Y: =(Parent.Height - Self.Height) / 2
            Width: =Parent.Width - (gblDevice.Padding * 2)
            Height: =30
    
    MainContainer As groupContainer:
        Fill: =gblTheme.White
        Height: =Parent.Height - HeaderContainer.Height - FooterContainer.Height - (gblDevice.Padding * 2)
        Width: =Parent.Width - (gblDevice.Padding * 2)
        X: =gblDevice.Padding
        Y: =HeaderContainer.Height + gblDevice.Padding
        
        iconSuccess As icon:
            Icon: =Icon.CheckBadge
            Color: =gblTheme.Success
            X: =(Parent.Width - 100) / 2
            Y: =50
            Width: =100
            Height: =100
            
        lblSuccessMessage As label:
            Text: ="Audit submitted successfully!"
            Color: =gblTheme.Text
            Size: =gblDevice.FontSize + 4
            FontWeight: =FontWeight.Bold
            Align: =Align.Center
            X: =gblDevice.Padding
            Y: =iconSuccess.Y + iconSuccess.Height + 20
            Width: =Parent.Width - (gblDevice.Padding * 2)
            
        lblAuditSummary As label:
            Text: ="Audit Score: " & varAuditScore & Char(10) &
                   "Facility: " & varSelectedFacility.Title & Char(10) &
                   "Date: " & Text(varAuditDate, "mm/dd/yyyy") & Char(10) &
                   "Total Findings: " & CountRows(colFindings) & Char(10) &
                   "  - Major: " & varMajorCount & Char(10) &
                   "  - Minor: " & varMinorCount & Char(10) &
                   "  - Observations: " & varObservationCount
            Color: =gblTheme.Text
            Size: =gblDevice.FontSize
            Align: =Align.Center
            X: =gblDevice.Padding
            Y: =lblSuccessMessage.Y + lblSuccessMessage.Height + 30
            Width: =Parent.Width - (gblDevice.Padding * 2)
            Height: =200
            
        lblNextSteps As label:
            Text: ="Your audit report has been saved and a PDF has been generated. The findings have been logged for tracking and resolution."
            Color: =gblTheme.Text
            Size: =gblDevice.FontSize
            Align: =Align.Center
            X: =gblDevice.Padding
            Y: =lblAuditSummary.Y + lblAuditSummary.Height + 20
            Width: =Parent.Width - (gblDevice.Padding * 2)
            Height: =80
    
    FooterContainer As groupContainer:
        Fill: =gblTheme.Light
        Height: =gblDevice.FooterHeight
        Width: =Parent.Width
        X: =0
        Y: =Parent.Height - Self.Height
        
        btnNewAudit As button:
            Text: ="Start New Audit"
            OnSelect: |+
                // Clear all collections and variables
                Clear(colFindings);
                Clear(colFindingPhotos);
                Clear(colGeneralPhotos);
                Clear(colInventories);
                Set(varAuditScore, 100);
                Set(varCurrentStep, 1);
                Set(varSelectedFacility, Blank());
                Set(varMajorCount, 0);
                Set(varMinorCount, 0);
                Set(varObservationCount, 0);
                
                // Navigate back to start
                Navigate(scrSetup, ScreenTransition.None);
            Fill: =gblTheme.Primary
            Color: =gblTheme.White
            X: =(Parent.Width - Self.Width) / 2
            Y: =(Parent.Height - Self.Height) / 2
            Width: =200
            Height: =50
            FontWeight: =FontWeight.Semibold

