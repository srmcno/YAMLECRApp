- scrInventories:
    Control: Screen@1.0.0
    Properties:
      Fill: =gblTheme.Light
    Children:
      - lblScreenTitle:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =gblTheme.Primary
            FontWeight: =FontWeight.Bold
            Height: =50
            Size: =20
            Text: ="scrInventories"
            Width: =Parent.Width
            X: =0
            Y: =20
            ZIndex: =1

      - lblPlaceholder:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =gblTheme.Text
            Height: =100
            Size: =14
            Text: ="Screen content for scrInventories - Implement per requirements"
            Width: =Parent.Width - 40
            X: =20
            Y: =100
            ZIndex: =2
