Screen As screen.scrSignature:
    Fill: =gblTheme.Light
    
    HeaderContainer As groupContainer:
        Fill: =gblTheme.Primary
        Height: =gblDevice.HeaderHeight
        Width: =Parent.Width
        X: =0
        Y: =0
        
        lblHeader As label:
            Text: ="Auditor Signature"
            Color: =gblTheme.White
            Size: =gblDevice.FontSize + 4
            FontWeight: =FontWeight.Bold
            X: =gblDevice.Padding
            Y: =(Parent.Height - Self.Height) / 2
            Width: =Parent.Width - (gblDevice.Padding * 2)
            Height: =30
    
    MainContainer As groupContainer:
        Fill: =gblTheme.White
        Height: =Parent.Height - HeaderContainer.Height - FooterContainer.Height - (gblDevice.Padding * 2)
        Width: =Parent.Width - (gblDevice.Padding * 2)
        X: =gblDevice.Padding
        Y: =HeaderContainer.Height + gblDevice.Padding
        
        lblInstruction As label:
            Text: ="Please sign below to certify that this audit was conducted according to ECR standards."
            Color: =gblTheme.Text
            Size: =gblDevice.FontSize
            X: =gblDevice.Padding
            Y: =gblDevice.Padding
            Width: =Parent.Width - (gblDevice.Padding * 2)
            Height: =60
            
        penSignature As penInput:
            X: =gblDevice.Padding
            Y: =lblInstruction.Y + lblInstruction.Height + 10
            Width: =Parent.Width - (gblDevice.Padding * 2)
            Height: =200
            BorderColor: =gblTheme.Border
            BorderThickness: =2
            
        btnClearSignature As button:
            Text: ="Clear Signature"
            OnSelect: =Reset(penSignature)
            Fill: =gblTheme.Border
            Color: =gblTheme.Text
            X: =gblDevice.Padding
            Y: =penSignature.Y + penSignature.Height + 10
            Width: =150
            Height: =40
            
        lblSubmitStatus As label:
            Text: =varSubmitStatus
            Color: =If(varSubmitSuccess, gblTheme.Success, gblTheme.Danger)
            Size: =gblDevice.FontSize
            Visible: =!IsBlank(varSubmitStatus)
            X: =gblDevice.Padding
            Y: =btnClearSignature.Y + btnClearSignature.Height + 20
            Width: =Parent.Width - (gblDevice.Padding * 2)
            Height: =60
    
    FooterContainer As groupContainer:
        Fill: =gblTheme.Light
        Height: =gblDevice.FooterHeight
        Width: =Parent.Width
        X: =0
        Y: =Parent.Height - Self.Height
        
        btnCancel As button:
            Text: ="Cancel"
            OnSelect: =Back()
            Fill: =gblTheme.Border
            Color: =gblTheme.Text
            X: =gblDevice.Padding
            Y: =(Parent.Height - Self.Height) / 2
            Width: =100
            Height: =50
            
        btnFinalSubmit As button:
            Text: ="Submit Audit"
            OnSelect: |+
                // Validate signature
                If(IsBlank(penSignature.Image),
                    Notify("Please provide your signature", NotificationType.Warning),
                    
                    // Start submission process
                    Set(varSubmitStatus, "Submitting audit...");
                    Set(varSubmitSuccess, false);
                    
                    // MASTER SUBMISSION FORMULA
                    // Step 1: Patch Parent Record to Audit Reports
                    Set(varAuditRecord,
                        Patch('Audit Reports', Defaults('Audit Reports'),
                            {
                                Title: varSelectedFacility.Title & " - " & varSelectedAuditType & " - " & Text(varAuditDate, "mm/dd/yyyy"),
                                Facility: {
                                    '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                                    Id: varSelectedFacility.ID,
                                    Value: varSelectedFacility.Title
                                },
                                AuditType: {
                                    '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedChoice",
                                    Value: varSelectedAuditType
                                },
                                Auditor: {
                                    '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                    Claims: "i:0#.f|membership|" & varAuditorEmail,
                                    DisplayName: varAuditorName,
                                    Email: varAuditorEmail
                                },
                                AuditDate: varAuditDate,
                                AuditScore: varAuditScore,
                                WeatherConditions: varWeather,
                                Latitude: varLatitude,
                                Longitude: varLongitude,
                                MajorFindings: varMajorCount,
                                MinorFindings: varMinorCount,
                                Observations: varObservationCount,
                                Department: "Environmental Compliance",
                                FacilityPull: varSelectedFacility.Title,
                                AuditComplete: "Yes"
                            }
                        )
                    );
                    
                    // Step 2: Refresh to ensure parent record is available
                    Refresh('Audit Reports');
                    
                    // Step 3: Patch Child Records (Findings) to ECR Corrective Actions
                    ForAll(colFindings,
                        Patch('ECR Corrective Actions', Defaults('ECR Corrective Actions'),
                            {
                                Title: CorrectiveActionText,
                                CorrectiveActionText: CorrectiveActionText,
                                Facility: {
                                    '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                                    Id: varSelectedFacility.ID,
                                    Value: varSelectedFacility.Title
                                },
                                ECRLink: {
                                    '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                                    Id: varAuditRecord.ID,
                                    Value: varAuditRecord.Title
                                },
                                Date_x0020_of_x0020_Finding: varAuditDate,
                                CAStatus: {
                                    '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedChoice",
                                    Value: "Unresolved"
                                },
                                Severityoffiding: {
                                    '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedChoice",
                                    Value: Severityoffiding
                                },
                                FindingCategory: {
                                    '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedChoice",
                                    Value: FindingCategory
                                },
                                Description: If(!IsBlank(Description), Description, CorrectiveActionText),
                                FixedOnSite: If(IsBlank(FixedOnSite), false, FixedOnSite),
                                AppFindingID: AppFindingID,
                                Department: "Environmental Compliance"
                            }
                        )
                    );
                    
                    // Step 4: Refresh findings list
                    Refresh('ECR Corrective Actions');
                    
                    // Step 5: Attach Finding Photos
                    // Match photos to findings using AppFindingID
                    ForAll(colFindingPhotos,
                        With({
                            matchedFinding: LookUp('ECR Corrective Actions', AppFindingID = FindingID)
                        },
                            If(!IsBlank(matchedFinding),
                                Patch('ECR Corrective Actions', matchedFinding,
                                    {
                                        Attachments: Table({
                                            Value: Photo
                                        })
                                    }
                                )
                            )
                        )
                    );
                    
                    // Step 6: Attach Parent Attachments (Signature and General Photos)
                    // Attach auditor signature
                    Patch('Audit Reports', varAuditRecord,
                        {
                            Attachments: Concatenate(
                                Table({Value: penSignature.Image}),
                                ForAll(colGeneralPhotos, {Value: Photo})
                            )
                        }
                    );
                    
                    // Step 7: Generate PDF Report
                    Set(varPDFBlob, PDF(scrPDFReport, {Orientation: "Portrait"}));
                    
                    // Step 8: Send to Power Automate Flow
                    'PowerAppV2->Createfile'.Run(
                        varPDFBlob,
                        varSelectedFacility.Title & "_" & varSelectedAuditType & "_" & Text(varAuditDate, "yyyymmdd") & ".pdf",
                        varAuditScore,
                        varAuditorName,
                        varWeather,
                        varLatitude,
                        varLongitude,
                        varSelectedFacility.ID
                    );
                    
                    // Success notification
                    Set(varSubmitStatus, "Audit submitted successfully!");
                    Set(varSubmitSuccess, true);
                    Notify("Audit submitted successfully! Score: " & varAuditScore, NotificationType.Success);
                    
                    // Navigate to completion screen after delay
                    Set(timerStart, true);
                );
            Fill: =gblTheme.Success
            Color: =gblTheme.White
            X: =Parent.Width - Self.Width - gblDevice.Padding
            Y: =(Parent.Height - Self.Height) / 2
            Width: =180
            Height: =50
            FontWeight: =FontWeight.Semibold
            Disabled: =IsBlank(penSignature.Image)
            
    timerAutoNav As timer:
        Duration: =3000
        Repeat: =false
        AutoStart: =timerStart
        OnTimerEnd: |+
            Set(timerStart, false);
            Navigate(scrComplete, ScreenTransition.None);
        Visible: =false

